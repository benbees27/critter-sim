<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Critter Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e1c;--panel:#1d1730;--line:#3a2f5c;--ink:#ece6ff;--dim:#8f86b3;--hi:#ffd45e;--ok:#6fe08a;--bad:#ff6a6a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:8px/1.7 "Press Start 2P",ui-monospace,Consolas,monospace;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:#2a2146;border:2px solid var(--line);padding:6px 8px;cursor:pointer;border-radius:0}
button:hover{border-color:var(--dim)}
button.on{background:#4a3a8a;border-color:var(--hi)}
button[hidden]{display:none}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:2px solid var(--line);position:relative;z-index:5}
#top h1{margin:0 10px 0 0;font-size:10px;color:var(--hi)}
#stats{margin-left:auto;color:var(--dim)}
#menu{position:absolute;top:100%;right:8px;display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--panel);border:2px solid var(--line);z-index:9}
#menu[hidden]{display:none}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0a0710;overflow:hidden}
#c{image-rendering:pixelated;touch-action:none;cursor:crosshair;box-shadow:0 0 0 3px var(--line);flex:none}
.ov{position:absolute;pointer-events:none}
.box{background:rgba(29,23,48,.93);border:2px solid var(--line);padding:8px 10px}
#goal{top:12px;right:12px;width:220px}
#goal .t{color:var(--hi)}
#goal .bar{display:block;width:100%;height:10px;margin:7px 0 5px}
.bar{display:inline-block;width:56px;height:8px;background:#0c0916;border:1px solid var(--line);vertical-align:middle;margin:0 6px 0 4px}
.bar i{display:block;height:100%}
.sil{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:flex-end}
.sil canvas{filter:brightness(0) opacity(.5);image-rendering:pixelated}
#toast{top:14px;left:50%;transform:translateX(-50%);text-align:center;border-color:var(--hi);transition:opacity .4s;opacity:0}
#toast.show{opacity:1}
#toast .t{color:var(--hi);margin-bottom:6px}
#toast .row{display:flex;gap:10px;justify-content:center;align-items:flex-end}
#toast .row canvas{image-rendering:pixelated}
#card{left:12px;bottom:12px}
#card .n{color:var(--hi);margin-bottom:4px}
#hint{left:50%;bottom:14px;transform:translateX(-50%);color:var(--hi);transition:opacity .6s}
#dock{display:flex;gap:10px;align-items:stretch;background:var(--panel);border-top:2px solid var(--line);padding:6px 8px;height:116px}
#dm{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
#tabs{display:flex;gap:4px;align-items:center}
.tab{padding:5px 9px}
#items{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:#4a3a8a #1d1730}
.tool{position:relative;flex:none;width:70px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px}
.tool .ic{height:34px;display:flex;align-items:center}
.tool canvas{image-rendering:pixelated}
.tool .n{position:absolute;top:1px;right:3px;color:var(--ok)}
.tool .new{position:absolute;top:1px;left:3px;color:var(--hi)}
#bHand{height:auto;width:70px}
.brush{padding:6px 8px;flex:none;align-self:center}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>CRITTER SIM</h1>
    <button id="bPause">PAUSE</button>
    <button id="bSpeed">SPEED 1X</button>
    <button id="bRain" hidden>RAIN</button>
    <button id="bSound">SOUND ON</button>
    <button id="bMenu">MENU</button>
    <span id="stats"></span>
    <div id="menu" hidden>
      <button id="mNew">NEW WORLD</button>
      <button id="mClear">CLEAR WORLD</button>
      <button id="mAll">UNLOCK EVERYTHING</button>
      <button id="mReset">RESET PROGRESS</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="goal" class="ov box"></div>
    <div id="toast" class="ov box"></div>
    <div id="card" class="ov box" hidden></div>
    <div id="hint" class="ov">PICK A CRITTER BELOW, THEN CLICK THE WORLD</div>
  </div>
  <div id="dock">
    <button id="bHand" class="tool on" data-t="grab"></button>
    <div id="dm"><div id="tabs"></div><div id="items"></div></div>
  </div>
</div>
<script>
'use strict';
const T=8,STEP=1/30,MAXA=320,PAD=3,DAY=160;
let W=480,H=272,GW=60,GH=34,G,FIRE;
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d');
const bg=document.createElement('canvas'),bgx=bg.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),hyp=Math.hypot,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

/* ============================================================
   SPRITE ENGINE
   Creatures are drawn as FLAT colour shapes (see art()). The engine then
     1. builds animation frames from the shape (leg cycles, tail wags, wing flaps, slithering, hopping...)
     2. auto-shades every frame (top-left light, bottom-right shadow) and adds a dark outline
     3. bakes left/right versions, a baby version (half-res) and a corpse
   Materials: a main, b secondary, c light/belly, d accent, e accent2; k detail-dark, w white, p pupil,
   t/T/u = tail pixels that wag (material a / e / b).
   ============================================================ */
const h2r=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function toHsl(hex){let[r,gg,b]=h2r(hex).map(v=>v/255);const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(gg-b)/d+(gg<b?6:0):mx===gg?(b-r)/d+2:(r-gg)/d+4;h*=60}return[h,s,l]}
function toHex(h,s,l){h=(h%360+360)%360;const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l);return Math.round((l-a*Math.max(-1,Math.min(k-3,9-k,1)))*255).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)}
const toward=(h,t,k)=>h+(((t-h+540)%360)-180)*k;
// shadows drift cool, highlights drift warm: that's what makes it feel hand-painted
function ramp(base){const[h,s,l]=toHsl(base);return{m:base,d:toHex(toward(h,255,.12),Math.min(1,s*1.05),l*.66),l:toHex(toward(h,55,.08),s*.92,l+(1-l)*.36),o:toHex(toward(h,255,.1),Math.min(.55,s*.8),.12)}}

/* tiny shape DSL: p pixel, ps pixel list, r rect, e ellipse, l line, poly, sym (mirror left->right) */
function art(w,h,fn){
  const g2=Array.from({length:h},()=>Array(w).fill('.'));
  const set=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<w&&y<h)g2[y][x]=c};
  const A={
    p:(x,y,c)=>set(x,y,c),
    ps:(s,c)=>s.split(' ').forEach(q=>{const[x,y]=q.split(',');set(+x,+y,c)}),
    r:(x0,y0,x1,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,c)},
    e:(cx,cy,rx,ry,c,ymax=1e9)=>{for(let y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry+1)&&y<=ymax;y++)for(let x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx+1);x++)if(((x-cx)/(rx+.5))**2+((y-cy)/(ry+.5))**2<=1)set(x,y,c)},
    l:(x0,y0,x1,y1,c,t=1)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;if(t<=1)set(x,y,c);else A.e(x,y,(t-1)/2,(t-1)/2,c)}},
    poly:(pts,c)=>{const ys=pts.map(q=>q[1]);for(let y=Math.floor(Math.min(...ys));y<=Math.ceil(Math.max(...ys));y++){const yy=y+.5,xs=[];for(let i=0;i<pts.length;i++){const[ax,ay]=pts[i],[bx,by]=pts[(i+1)%pts.length];if((ay<=yy&&by>yy)||(by<=yy&&ay>yy))xs.push(ax+(yy-ay)*(bx-ax)/(by-ay))}xs.sort((a,b)=>a-b);for(let i=0;i+1<xs.length;i+=2)for(let x=Math.round(xs[i]);x<=Math.round(xs[i+1]);x++)set(x,y,c)}},
    sym:()=>{for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(g2[y][x]!=='.'&&g2[y][w-1-x]==='.')g2[y][w-1-x]=g2[y][x]},
  };
  fn(A);return g2.map(r=>r.join(''));
}

/* ---- grid transforms used to build animation frames ---- */
const blank=(w,h)=>Array.from({length:h},()=>Array(w).fill('.'));
const toGrid=rows=>{const w=Math.max(...rows.map(r=>r.length)),o=blank(w+2*PAD,rows.length+2*PAD);rows.forEach((r,y)=>[...r].forEach((c,x)=>o[y+PAD][x+PAD]=c));return o};
const bbox=gr=>{let x0=1e9,y0=1e9,x1=-1,y1=-1;gr.forEach((r,y)=>r.forEach((c,x)=>{if(c!=='.'){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}}));return{x0,y0,x1,y1}};
function warp(gr,pred,fn){const out=gr.map(r=>r.slice()),mv=[];gr.forEach((r,y)=>r.forEach((c,x)=>{if(c!=='.'&&pred(x,y,c)){mv.push([x,y,c]);out[y][x]='.'}}));for(const[x,y,c]of mv){const[dx,dy]=fn(x,y),X=x+dx,Y=y+dy;if(Y>=0&&X>=0&&Y<out.length&&X<out[0].length)out[Y][X]=c}return out}
function lift(gr,K,parity){ // raise every other leg: the walk cycle
  const b=bbox(gr),runs=[];let cur=null;
  for(let x=b.x0;x<=b.x1;x++){let has=false;for(let y=b.y1-K+1;y<=b.y1;y++)if(gr[y][x]!=='.'){has=true;break}
    if(has){if(!cur){cur=[x,x];runs.push(cur)}else cur[1]=x}else cur=null}
  let out=gr;runs.forEach((r,i)=>{if(i%2===parity)out=warp(out,(x,y)=>y>b.y1-K&&x>=r[0]&&x<=r[1],()=>[1,-1])});return out}
function tailWag(gr,p){if(!p)return gr;const xs=[];gr.forEach(r=>r.forEach((c,x)=>{if(TAIL.includes(c))xs.push(x)}));if(!xs.length)return gr;const lo=Math.min(...xs),hi=Math.max(...xs);return warp(gr,(x,y,c)=>TAIL.includes(c),x=>[0,Math.round(p*2*(hi-x)/(hi-lo||1))])}
function flap(gr,Wd,dy){if(!dy)return gr;const b=bbox(gr);return warp(gr,x=>x<b.x0+Wd||x>b.x1-Wd,x=>[0,Math.round(dy*(x<b.x0+Wd?(b.x0+Wd-x)/Wd:(x-(b.x1-Wd))/Wd))])}
function swim(gr,Wd,dy){if(!dy)return gr;const b=bbox(gr);return warp(gr,x=>x<b.x0+Wd,x=>[0,Math.round(dy*(b.x0+Wd-x)/Wd)])}
const slither=(gr,amp,f)=>warp(gr,()=>true,x=>[0,Math.round(amp*Math.sin(x*.55+f*Math.PI/2))]);
function sway(gr,d){if(!d)return gr;const b=bbox(gr);return warp(gr,()=>true,(x,y)=>[Math.round(d*(b.y1-y)/(b.y1-b.y0+1)),0])}
function squash(gr){const b=bbox(gr),r=b.y0+Math.round((b.y1-b.y0)*.5);return gr.map((row,y)=>y>r?row.slice():(gr[y-1]||row.map(()=>'.')).slice())}
function stretch(gr){const b=bbox(gr),r=b.y0+Math.round((b.y1-b.y0)*.5);return gr.map((row,y)=>y>r?row.slice():(y===r?row:gr[y+1]).slice())}
function half(rows){ // babies: 2x2 majority downsample so they stay crisp pixel art
  const w=Math.max(...rows.map(r=>r.length)),out=[];
  for(let y=0;y<rows.length;y+=2){let line='';for(let x=0;x<w;x+=2){const cnt={};let n=0;
    for(const[dx,dy]of[[0,0],[1,0],[0,1],[1,1]]){const c=(rows[y+dy]||'')[x+dx]||'.';if(c!=='.'){cnt[c]=(cnt[c]||0)+1;n++}}
    line+=cnt.p?'p':n>=2?Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]:'.'}out.push(line)}
  return out}

const MAT={a:'a',b:'b',c:'c',d:'d',e:'e',t:'a',T:'e',u:'b'},TAIL='tTu',D4=[[0,-1],[-1,0],[1,0],[0,1]];
function paint(gr,rp){ // auto outline + auto shading
  const h=gr.length,w=gr[0].length,c=mk(w,h),x=c.getContext('2d');
  const on=(X,Y)=>Y>=0&&X>=0&&Y<h&&X<w&&gr[Y][X]!=='.';
  for(let Y=0;Y<h;Y++)for(let X=0;X<w;X++){
    const ch=gr[Y][X];let col=null;
    if(ch==='.'){for(const[dx,dy]of D4)if(on(X+dx,Y+dy)){col=(rp[MAT[gr[Y+dy][X+dx]]]||rp.a).o;break}}
    else if(ch==='w')col='#ffffff';else if(ch==='p')col='#1b1026';else if(ch==='k')col=rp.a.o;
    else{const r=rp[MAT[ch]]||rp.a,lit=!on(X,Y-1)||!on(X-1,Y),sh=!on(X,Y+1)||!on(X+1,Y);col=lit&&!sh?r.l:sh&&!lit?r.d:r.m}
    if(col){x.fillStyle=col;x.fillRect(X,Y,1,1)}
  }
  return c}
function crop(c){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=-1,y1=-1;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
  const o=mk(x1-x0+1,y1-y0+1);o.getContext('2d').drawImage(c,-x0,-y0);return o}
function buildFrames(g0,o){
  const tp=[0,1,0,-1],tw=(gr,p)=>o.tail?tailWag(gr,p):gr,F={idle:[g0],walk:[g0]};
  switch(o.rig){
    case'quad':case'biped':F.walk=[null,0,null,1].map((p,i)=>tw(p===null?g0:lift(g0,o.legs,p),tp[i]));F.idle=[tw(g0,0),tw(g0,1)];break;
    case'hop':F.walk=[stretch(g0),g0,squash(g0),g0];F.idle=[g0,g0,g0,squash(g0)];break;
    case'flap':F.walk=F.idle=[-1,0,1,0].map(p=>flap(g0,o.wing,o.amp*p));break;
    case'swim':F.walk=F.idle=tp.map(p=>swim(g0,o.tailW,o.amp*p));break;
    case'slither':F.walk=F.idle=[0,1,2,3].map(f=>slither(g0,o.amp,f));break;
    case'sway':F.walk=F.idle=tp.map(p=>sway(g0,o.amp*p));break;
  }
  F.blink=F.idle[0].map(r=>r.map(c=>c==='p'?'k':c));
  return F}
function makeSet(rows,rp,look,baby){
  const r=baby?half(rows):rows,o=baby?{...look,legs:Math.ceil((look.legs||0)/2),wing:Math.ceil((look.wing||0)/2),amp:Math.max(1,Math.round((look.amp||1)/2)),tailW:Math.ceil((look.tailW||0)/2)}:look;
  const F=buildFrames(toGrid(r),o),w=Math.max(...r.map(x=>x.length)),h=r.length;
  const bake=gs=>gs.map(gr=>({R:paint(gr,rp),L:paint(gr.map(q=>q.slice().reverse()),rp)}));
  const set={w,h,cw:w+2*PAD,ch:h+2*PAD,idle:bake(F.idle),walk:bake(F.walk),blink:bake([F.blink])[0]};
  if(look.bite&&!baby)set.bite=bake([toGrid(look.bite)]);
  const R=set.idle[0].R,d=mk(R.width,R.height),dx=d.getContext('2d');
  dx.translate(0,R.height);dx.scale(1,-1);dx.drawImage(R,0,0);dx.setTransform(1,0,0,1,0,0);
  dx.globalCompositeOperation='source-atop';dx.fillStyle='rgba(80,80,96,.5)';dx.fillRect(0,0,R.width,R.height);
  set.dead=d;set.icon=crop(R);return set}

/* ============================================================
   SPECIES.  def(id, traits, look, art)
   traits drive behaviour: size, spd(px/s), met(hunger/s), life, mature, cd(breed cooldown), litter, sight,
   diet ['plant','berry','meat','prey:*','prey:<tag>'], hab (land|water|both|fly), tags.
   Add a def() and it appears in the toolbar and joins the food web.
   ============================================================ */
const SP={};
function def(id,o,look,rows){
  const rp={};for(const k of'abcde')rp[k]=ramp(look.pal[k]||look.pal.a);
  const s={id,kind:'animal',tags:[],diet:[],hab:'land',size:1,litter:1,rig:look.rig||'none',berryAt:look.berryAt,...o};
  s.A=makeSet(rows,rp,look,false);s.B=makeSet(rows,rp,look,true);s.w=s.A.w;s.h=s.A.h;
  return SP[id]=s}

/* ---------- small prey / grazers ---------- */
def('mouse',{name:'Mouse',tags:['rodent'],spd:16,met:.02,life:180,mature:10,cd:40,litter:2,sight:55,diet:['plant','berry']},
{pal:{a:'#a971c9',b:'#7a4aa0',c:'#e7c4f2',d:'#f6a8be',e:'#f6a8be'},rig:'quad',legs:2,tail:true},
art(22,15,A=>{
  A.e(9,8,7,4,'a');A.e(10,10,5,2,'c');A.e(16,7,4,4,'a');A.e(20,8,2,2,'a');
  A.e(14,3,3,3,'a');A.e(14,3,1,2,'d');A.p(21,8,'d');
  A.ps('18,6 18,7','p');A.p(19,6,'w');
  A.l(1,9,0,7,'T');A.l(0,7,0,4,'T');A.p(1,3,'T');
  A.r(5,13,6,14,'b');A.r(9,13,10,14,'b');A.r(13,13,14,14,'b');A.r(16,13,17,14,'b');
}));
def('chick',{name:'Chick',size:2,tags:['bird'],spd:14,met:.016,life:220,mature:14,cd:28,litter:2,sight:55,diet:['plant','berry']},
{pal:{a:'#f6f1e8',b:'#cfc7dc',c:'#ffffff',d:'#e8423a',e:'#f2a63a'},rig:'biped',legs:3,tail:true},
art(20,20,A=>{
  A.e(8,10,7,6,'a');A.e(13,6,4,4,'a');A.e(13,1,2,1,'d');
  A.r(18,6,19,7,'e');A.ps('17,9 17,10','d');
  A.ps('15,5 15,6','p');A.p(16,5,'w');
  A.e(7,10,4,3,'b');A.l(5,10,9,10,'c');
  A.e(2,8,2,3,'u');
  A.r(7,17,7,19,'e');A.r(11,17,11,19,'e');A.r(6,19,8,19,'e');A.r(10,19,12,19,'e');
}));
def('soot',{name:'Soot',tags:['spirit','rodent'],spd:22,met:.02,life:150,mature:8,cd:40,litter:2,sight:50,diet:['plant','berry']},
{pal:{a:'#3d3150',b:'#2a2038',c:'#6a5a85',d:'#ffffff',e:'#ffffff'},rig:'hop'},
`..a...a..a..
.a..aaaa..a.
..aaaaaaaaa.
.aaaaaaaaaaa
aaaawwaawwaa
.aaapwaapwaa
aaaaaaaaaaaa
.aacaaaaacaa
aaaaaaaaaaaa
.aa.aaa.aa..
a..a..a..a..`.split('\n'));
def('slime',{name:'Slime',tags:['slime'],hab:'both',asexual:true,spd:8,met:.012,life:200,mature:10,cd:35,sight:40,diet:['plant','meat']},
{pal:{a:'#4fd6c4',b:'#27a39d',c:'#b4f7ec',d:'#ff9fb8',e:'#ffffff'},rig:'hop'},
art(20,12,A=>{
  A.e(10,9,9,9,'a');A.ps('5,3 6,3 4,4 4,5','c');
  A.r(7,5,8,7,'w');A.ps('8,6 8,7','p');A.r(12,5,13,7,'w');A.ps('13,6 13,7','p');
  A.ps('9,8 12,8','k');A.r(10,9,11,9,'k');A.ps('5,8 14,8','d');
}));
def('turtle',{name:'Shell',size:3,tags:['reptile'],tough:1.8,spd:8,met:.008,life:400,mature:30,cd:55,sight:50,diet:['plant','berry']},
{pal:{a:'#86c744',b:'#4f8f2c',c:'#d6ee8a',d:'#9a5f2e',e:'#cf9550'},rig:'quad',legs:4,tail:true},
art(30,20,A=>{
  A.e(12,8,9,6,'d');

/* sanity check: a typo'd diet tag silently makes a species harmless, so shout about it */
for(const s of Object.values(SP)){s.reach??=6+s.size*1.5;s.hunger??=.65;s.cap??=[0,70,40,18,10,5][s.size];s.tough??=1}
(function selfCheck(){
  const tags=new Set(Object.values(SP).flatMap(s=>s.tags));
  for(const s of Object.values(SP))for(const d of s.diet){
    if(['plant','berry','meat','prey:*'].includes(d))continue;
    if(!d.startsWith('prey:')||!tags.has(d.slice(5)))console.warn('bad diet entry',s.id,d);
  }
})();

/* ============================================================
   WORLD
   ============================================================ */
// tile codes: 0 grass 1 water 2 sand 3 rock 4 ash; 9 = off-map
const idxAt=(x,y)=>x<0||y<0||x>=W||y>=H?-1:(y/T|0)*GW+(x/T|0);
const tileAt=(x,y)=>{const i=idxAt(x,y);return i<0?9:G[i]};
const gt=(tx,ty)=>!G||tx<0||ty<0||tx>=GW||ty>=GH?3:G[ty*GW+tx];
function enterable(s,t){
  if(t===9)return false;
  switch(s.hab){case'fly':return true;case'water':return t===1;case'both':return t!==3;default:return t===0||t===2||t===4}
}

function nearFire(e){

const aim=(e,x,y)=>{const d=hyp(x-e.x,y-e.y)||1;e.dx=(x-e.x)/d;e.dy=(y-e.y)/d};

/* The brain: danger > hunger > mating > wandering. Nothing is species-specific; behaviour falls out of size/diet/tags. */
function think(e){

  }

/* ============================================================
   PROGRESSION: start with a handful of tools, unlock more as the world thrives
   ============================================================ */
const START=['mouse','chick','fish','grass','lily','terrain:1','terrain:0','terrain:2'];
const TIERS=[
  {name:'FIRST LIFE',goal:{k:'animals',n:16},give:['bush','soot','slime','rain']},
  {name:'THE GARDEN',goal:{k:'species',n:4,m:4},give:['daisy','mushroom','turtle','bat','terrain:3','meat']},
  {name:'FOOD CHAIN',goal:{k:'animals',n:30},give:['cat','snake','shroomie','torch']},
  {name:'THE WILDS',goal:{k:'animals',n:45},give:['fox','shiba','whale','heal']},
  {name:'APEX',goal:{k:'species',n:5,m:5},give:['imp','angler','raptor','erase']},
  {name:'LEGENDS',goal:{k:'animals',n:70},give:['serpent','snapper','dragon','bolt']},
];
let tier=0,lastGrant=0,have=new Set(START);const fresh=new Set();
try{tier=Math.min(TIERS.length,+localStorage.getItem('critter-tier')||0)}catch(e){}
function computeHave(){have=new Set(START);for(let i=0;i<tier;i++)TIERS[i].give.forEach(x=>have.add(x))}
function goalProg(){
  const q=TIERS[tier];if(!q)return null;const gl=q.goal;
  if(gl.k==='animals')return{cur:nAnimals,max:gl.n,text:`Grow to ${gl.n} animals`};
  const c=Object.entries(counts).filter(([id,n])=>SP[id].kind==='animal'&&n>=gl.m).length;
  return{cur:c,max:gl.n,text:`${gl.n} species with ${gl.m}+ each`};
}
function checkGoal(){
  const gp=goalProg();
  if(gp&&gp.cur>=gp.max&&simT-lastGrant>40)grantTier(); // goals also need a breather between unlocks
  renderGoal();
}
function grantTier(){
  const q=TIERS[tier];tier++;lastGrant=simT;try{localStorage.setItem('critter-tier',tier)}catch(e){}
  computeHave();q.give.forEach(x=>fresh.add(x));renderDock();showToast(q);
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx('jingle'+i,f,.16,'square',.04),i*110));
}
function setTier(n){tier=n;lastGrant=simT;try{localStorage.setItem('critter-tier',tier)}catch(e){}computeHave();fresh.clear();renderDock();renderGoal()}

let AC=null,muted=false,audioOK=false;const lastSfx={},GAP={tick:30,spawn:60,bite:260,die:300,birth:300};
function sfx(n,f,d=.08,type='square',v=.035,slide=1){
  if(muted||!audioOK)return;const t=performance.now();if(t-(lastSfx[n]||0)<(GAP[n]||90))return;lastSfx[n]=t;
  try{AC=AC||new AudioContext();const o=AC.createOscillator(),gn=AC.createGain(),now=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,now);if(slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),now+d);
    gn.gain.setValueAtTime(v,now);gn.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(gn);gn.connect(AC.destination);o.start(now);o.stop(now+d)}catch(e){}
}

function spot(s){for(let n=0;n<80;n++){const x=rnd(8,W-8),y=rnd(14,H-4),t=tileAt(x,y);if(s.kind==='plant'?t===s.tile:enterable(s,t)&&t!==3)return[x,y]}return null}
function populate(spec){for(const[id,n]of Object.entries(spec))for(let i=0;i<n;i++){const p=spot(SP[id]);if(p)spawn(id,p[0],p[1])}}

  E=[];counts={};nAnimals=0;FX.length=0;sel=grabbed=null;simT=0;lastGrant=0;genWorld();

  populate({grass:Math.round(GW*GH/90),lily:4,mouse:3,chick:3,fish:4});

const setOf=e=>{const s=e.sp;return e.k==='animal'?(e.age<s.mature?s.B:s.A):e.k==='plant'?(e.age<s.grow?s.B:s.A):s.A};

  else if(e.moving)fr=set.walk[(e.fa|0)%set.walk.length];
  else{fr=set.idle[(simT*(s.rig==='swim'?3:s.rig==='sway'?1.6:2)+e.id*.37|0)%set.idle.length];

}
function draw(){

function nearest(x,y,r,animalsOnly){
  let best=null,bd=r*r;
  for(const e of E){
    if(animalsOnly&&e.k!=='animal')continue;
    const set=setOf(e),cy=e.y-set.h/2,d=(e.x-x)**2+(cy-y)**2;if(d<bd){bd=d;best=e}
  }
  return best;
}
function paint2(x,y,type){
  const tx=x/T|0,ty=y/T|0;
  for(let dy=-brush;dy<=brush;dy++)for(let dx=-brush;dx<=brush;dx++){
    if(dx*dx+dy*dy>brush*brush+brush*.8)continue;
    const X=tx+dx,Y=ty+dy;if(X<0||Y<0||X>=GW||Y>=GH)continue;
    G[Y*GW+X]=type;FIRE[Y*GW+X]=0;
  }
  bgDirty=true;
}
function placed(){if(hintOn){hintOn=false;$('#hint').style.opacity=0}}
function useTool(p,first){
  const now=performance.now(),rate=now-lastUse>140;
  switch(tool.t){
    case'grab':
      if(first){grabbed=nearest(p.x,p.y,12,true);sel=grabbed||nearest(p.x,p.y,12,false);if(grabbed)sfx('tick',900,.04)}
      if(grabbed){grabbed.x=clamp(p.x,2,W-2);grabbed.y=clamp(p.y,12,H-2);grabbed.mode='idle';grabbed.tgt=null}
      break;
    case'spawn':
      if(first||rate){
        lastUse=now;const s=SP[tool.arg],j=first?0:6,x=p.x+rnd(-j,j),y=p.y+rnd(-j,j);
        if(s.kind==='plant'){if(tileAt(x,y)===s.tile){spawn(s.id,x,y);placed();sfx('spawn',520,.08,'square',.035,1.7)}}
        else if(nAnimals<MAXA&&(s.spd>0||enterable(s,tileAt(x,y)))){spawn(s.id,x,y);placed();sfx('spawn',520,.08,'square',.035,1.7)} // rooted things need valid ground
      }
      break;
    case'meat':if(first||rate){lastUse=now;meat(p.x+(first?0:rnd(-6,6)),p.y);placed();sfx('spawn',300,.07)}break;
    case'terrain':paint2(p.x,p.y,+tool.arg);if(rate){lastUse=now;sfx('tick',260,.05)}break;
    case'torch':ignite(idxAt(p.x,p.y));if(rate){lastUse=now;sfx('fire',180,.18,'sawtooth',.02,.5)}break;
    case'bolt':
      if(first){
        fx('bolt',p.x,p.y);flash=.18;sfx('bolt',1000,.3,'sawtooth',.05,.08);
        for(const o of E)if(o.k==='animal'&&hyp(o.x-p.x,o.y-p.y)<14){o.hp=0;die(o)}
        const i=idxAt(p.x,p.y);ignite(i);

    case'heal':
      if(rate){lastUse=now;sfx('birth',700,.1,'triangle',.04,1.4);for(const o of E)if(o.k==='animal'&&hyp(o.x-p.x,o.y-p.y)<22){o.hp=o.mhp;o.food=1;fx('heart',o.x,o.y-o.sp.h)}}
      break;
    case'erase':for(const o of E)if(hyp(o.x-p.x,o.y-p.y)<10)o.dead=true;break;
  }
}
